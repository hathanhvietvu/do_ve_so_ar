name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Backup Custom Code
        run: |
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/main.dart
          cp pubspec.yaml temp_backup/pubspec.yaml

      - name: Create Android Native Platform
        run: |
          flutter create . --org com.example.doveso --platforms android

      - name: Restore Custom Code
        run: |
          cp temp_backup/main.dart lib/main.dart
          cp temp_backup/pubspec.yaml pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-DoVeSo-Release
          path: build/app/outputs/flutter-apk/app-release.apk
